# 方案 A：宿主机编辑，容器内跑 dev。
# 改业务代码不必重建镜像；仅 Dockerfile.dev 变更时再 docker compose build。
# TS API server 已删除：web 容器只跑前端 dev 与容器内 sshd，/api/* 全部由
# apps/server-go/docker-compose.go-dev.yml 的 go 容器提供（两栈经 elysian-db-local /
# elysian-db-shared 共享网络互通，web 容器按服务别名 go 直连）。
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # 只发布到宿主回环：面板端口与防火墙端点不带鉴权，不能暴露给局域网（发布端口与契约 PANEL_PORT 同值）。
      - "127.0.0.1:48100:48100"
      # 容器内 sshd 供 SSH 联调，同样只绑宿主回环，绝不裸绑局域网。
      # SSH 面板的数据源是 go-dev 容器内的 sshd（2223，日志归 Go 后端读）；本容器
      # 的 sshd 只作手动 ssh 进来摸环境的联调目标。
      - "127.0.0.1:2222:22"
    environment:
      ELYSIAN_DOCKER: "1"
      # 容器内 dev 需要绑 0.0.0.0 才能被宿主机经端口映射访问；同时经 vite define
      # 决定浏览器侧适配层走 HTTP 还是 mock。
      # API 代理目标：web 容器经共享网络按 go-dev 编排的服务别名直连 Go 后端
      # （监听容器内契约端口 48101，权威在 apps/server-go/internal/config 的 ListenPort）。
      # go 栈未启动时 API 请求报网络错误、不阻断前端 dev；宿主机直跑前端时
      # vite.config 缺省代理 127.0.0.1:48101，不需要本变量。
      ELYSIAN_API_ORIGIN: http://go:48101
    networks:
      - default
      # 与 go-dev 编排共享的两张外部网：web 容器靠它们按服务别名解析并直连 go 容器
      # （ELYSIAN_API_ORIGIN）；database 域的容器 IP 直连发生在 go 容器侧，与此无关。
      - elysian-db-local
      - elysian-db-shared
    volumes:
      - .:/app
      # 面板自管数据统一放部署机的 ~/.Elysian（分类：data 库 / logs 日志 / state 时间戳 /
      # backups 备份 / tmp 工作区 / config 预留）。卷不能直接挂 /root（会吞掉 /root/.bun
      # 导致 bun 消失），因此挂 /var/lib/elysian 并由 command 建立 /root/.Elysian 符号链接。
      # 本栈的卷只承载容器内 sshd 的日志与主机密钥；面板数据（库、凭证、登记）在
      # go-dev 编排的 elysian_go_state 卷里。
      - elysian_metrics:/var/lib/elysian
      # 依赖留在容器 volume，避免 Mac/Linux 原生二进制互相覆盖。
      - elysian_node_modules:/app/node_modules
      - elysian_web_node_modules:/app/apps/web/node_modules
      - elysian_contracts_node_modules:/app/packages/foundation/contracts/node_modules
      # sshd 主机密钥：嵌套挂在数据卷的 ssh/host-keys 下。镜像构建期的 ssh-keygen -A
      # 每次重建镜像都会换一套新钥，宿主机 known_hosts 随即报 REMOTE HOST IDENTIFICATION
      # HAS CHANGED；首次启动把镜像里的密钥种进卷，之后 /etc/ssh/ssh_host_* 一律是
      # 指向卷的符号链接，身份不再变。
      - elysian_ssh_host_keys:/var/lib/elysian/ssh/host-keys
    # 先备好 ~/.Elysian 的分类目录与符号链接、种主机密钥并落到默认路径，再起容器内
    # sshd：日志写 ~/.Elysian/logs/sshd.log，启动失败只影响 SSH 联调、不阻断 dev；
    # 最后安装依赖并启动 vite dev。API 不在本容器：/api/* 由 vite 同源代理转发到
    # ELYSIAN_API_ORIGIN 指向的 go 容器。
    command: sh -c "mkdir -p /var/lib/elysian/data /var/lib/elysian/logs /var/lib/elysian/state /var/lib/elysian/backups /var/lib/elysian/tmp /var/lib/elysian/config && ln -sfn /var/lib/elysian /root/.Elysian && if [ ! -e /root/.Elysian/ssh/host-keys/ssh_host_ed25519_key ]; then cp -a /etc/ssh/ssh_host_* /root/.Elysian/ssh/host-keys/; fi && ln -sfn /root/.Elysian/ssh/host-keys/* /etc/ssh/ && mkdir -p /run/sshd && (/usr/sbin/sshd -E /root/.Elysian/logs/sshd.log || true) && bun install && bun run dev"

volumes:
  elysian_metrics:
  elysian_node_modules:
  elysian_web_node_modules:
  elysian_contracts_node_modules:
  elysian_ssh_host_keys:

networks:
  elysian-db-local:
    name: elysian-db-local
  elysian-db-shared:
    name: elysian-db-shared
