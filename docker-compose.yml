# 方案 A：宿主机编辑，容器内跑 dev。
# 改业务代码不必重建镜像；仅 Dockerfile.dev 变更时再 docker compose build。
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # 只发布到宿主回环：dev 服务与防火墙端点不带鉴权，不能暴露给局域网。
      - "127.0.0.1:5173:5173"
      # 容器内 sshd 供 SSH 面板联调取登录日志，同样只绑宿主回环，绝不裸绑局域网。
      - "127.0.0.1:2222:22"
    environment:
      ELSYIAN_DOCKER: "1"
    # 防火墙面板真实执行 ufw/iptables，需要网络管理能力。
    cap_add:
      - NET_ADMIN
    volumes:
      - .:/app
      - elysian_metrics:/var/lib/elysian
      # 依赖留在容器 volume，避免 Mac/Linux 原生二进制互相覆盖。
      - elysian_node_modules:/app/node_modules
      - elysian_web_node_modules:/app/apps/web/node_modules
      - elysian_contracts_node_modules:/app/packages/foundation/contracts/node_modules
      # sshd 主机密钥持久化：镜像构建期的 ssh-keygen -A 每次重建镜像都会换一套新钥，
      # 宿主机 known_hosts 随即报 REMOTE HOST IDENTIFICATION HAS CHANGED；首次启动把
      # 镜像里的密钥种进卷，之后 /etc/ssh/ssh_host_* 一律是指向卷的符号链接，身份不再变。
      - elysian_ssh_host_keys:/etc/ssh/host-keys
    # 先起容器内 sshd：主机密钥种进卷并落到默认路径（见上），建权限分离目录 /run/sshd，
    # 日志写 /var/log/sshd.log（SSH 面板数据源），启动失败只影响 SSH 联调、不阻断 dev server，
    # 然后照常安装依赖并启动 dev。
    command: sh -c "mkdir -p /etc/ssh/host-keys && if [ ! -e /etc/ssh/host-keys/ssh_host_ed25519_key ]; then cp -a /etc/ssh/ssh_host_* /etc/ssh/host-keys/; fi && ln -sfn /etc/ssh/host-keys/* /etc/ssh/ && mkdir -p /run/sshd && (/usr/sbin/sshd -E /var/log/sshd.log || true) && bun install && bun run dev"

volumes:
  elysian_metrics:
  elysian_node_modules:
  elysian_web_node_modules:
  elysian_contracts_node_modules:
  elysian_ssh_host_keys:
