# 方案 A：宿主机编辑，容器内跑 dev。
# 改业务代码不必重建镜像；仅 Dockerfile.dev 变更时再 docker compose build。
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # 只发布到宿主回环：面板端口与防火墙端点不带鉴权，不能暴露给局域网（发布端口与契约 PANEL_PORT 同值）。
      - "127.0.0.1:48100:48100"
      # 容器内 sshd 供 SSH 面板联调取登录日志，同样只绑宿主回环，绝不裸绑局域网。
      - "127.0.0.1:2222:22"
    environment:
      ELYSIAN_DOCKER: "1"
      # 绑定挂载对齐根：服务端按容器内路径校验挂载越界，须与 volumes 里同一变量的
      # bind 挂载同值；macOS 必设为已共享路径，未设时 compose up 显式挂载报错。
      ELYSIAN_DOCKER_MOUNT_ROOT: ${ELYSIAN_DOCKER_MOUNT_ROOT:-/srv}
      # 宿主 Caddy 管理通道 socket（网站域反向代理）。宿主侧用 Caddy 官方 apt 仓库装
      # caddy、systemd 常驻，/etc/caddy/Caddyfile 全局段写 admin unix//run/caddy/admin.sock，
      # 并用 systemd drop-in（RuntimeDirectory=caddy）或 tmpfiles.d 保证 /run/caddy 开机即在；
      # Caddy 绝不进面板镜像、也不用 caddy 容器承载流量。宿主没装 caddy 时通道如实降级
      # （列表横幅呈现不可用），站点容器生命周期不受影响。
      ELYSIAN_CADDY_SOCKET: ${ELYSIAN_CADDY_SOCKET:-/run/caddy/admin.sock}
    # 防火墙面板真实执行 ufw/iptables，需要网络管理能力。
    cap_add:
      - NET_ADMIN
    networks:
      - default
      - elysian-db-local
      - elysian-db-shared
    volumes:
      - .:/app
      # 面板自管数据统一放部署机的 ~/.Elysian（分类：data 库 / logs 日志 / state 时间戳 /
      # backups 备份 / tmp 工作区 / config 预留）。卷不能直接挂 /root（会吞掉 /root/.bun
      # 导致 bun 消失），因此挂 /var/lib/elysian 并由 command 建立 /root/.Elysian 符号链接。
      - elysian_metrics:/var/lib/elysian
      # 依赖留在容器 volume，避免 Mac/Linux 原生二进制互相覆盖。
      - elysian_node_modules:/app/node_modules
      - elysian_web_node_modules:/app/apps/web/node_modules
      - elysian_contracts_node_modules:/app/packages/foundation/contracts/node_modules
      # sshd 主机密钥：嵌套挂在数据卷的 ssh/host-keys 下。镜像构建期的 ssh-keygen -A
      # 每次重建镜像都会换一套新钥，宿主机 known_hosts 随即报 REMOTE HOST IDENTIFICATION
      # HAS CHANGED；首次启动把镜像里的密钥种进卷，之后 /etc/ssh/ssh_host_* 一律是
      # 指向卷的符号链接，身份不再变。
      - elysian_ssh_host_keys:/var/lib/elysian/ssh/host-keys
      # 宿主引擎 socket（DooD）：文件级 bind 挂载，容器页经 Engine API 直连宿主 dockerd。
      # 勿改挂 /var/run 整目录——Ubuntu 里它是 /run 的符号链接，会吞掉 command 建的 /run/sshd。
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主 Caddy 的 admin socket：**目录级** bind。caddy 重启（含 systemd 升级重启）会
      # unlink 旧 socket 并以新 inode 重建，文件级 bind 的容器内挂载点会一直指向旧 inode，
      # 通道从此静默不可用；且宿主 socket 尚不存在时 Docker 会把文件级挂载目标创建为
      # 目录，caddy 反而无法绑定。docker.sock 用文件级是因为 dockerd 从不重建 socket，
      # 该先例不能照抄到会重启的进程。宿主目录缺失时 Docker 自动建空目录（对目录 bind
      # 无害，caddy 启动后在目录内建 socket 即可）。
      - /run/caddy:/run/caddy
      # 绑定挂载对齐根：挂载源由宿主引擎按宿主文件系统解析，而 realpath 校验与 mkdir 在
      # web 容器内执行，两侧须同路径同内容。macOS Docker Desktop 默认只共享 /Users、
      # /Volumes、/private、/tmp，启动前必须设为 /Users/<用户>/Elysian-srv 之类已共享路径，
      # 未设时 compose up 显式挂载报错；Linux 真机默认 /srv 成立。
      - ${ELYSIAN_DOCKER_MOUNT_ROOT:-/srv}:${ELYSIAN_DOCKER_MOUNT_ROOT:-/srv}
    # 先备好 ~/.Elysian 的分类目录与符号链接、种主机密钥并落到默认路径，再起容器内
    # sshd：日志写 ~/.Elysian/logs/sshd.log（SSH 面板数据源），启动失败只影响 SSH 联调、
    # 不阻断 dev server；然后安装依赖，在同一 sh -c 进程组后台起 API server
    # （bun run --filter @elysian/server dev，监听容器内回环（shared/ports.ts 的 SERVER_PORT），vite 经
    # server.proxy 转发 /api/security、/api/files 与 /api/platform 到这里，该端口不发布到宿主），
    # server 启动失败只影响安全、文件管理与内存徽标端点、不阻断 dev（与 sshd 同策略），最后照常启动 dev。
    command: sh -c "mkdir -p /var/lib/elysian/data /var/lib/elysian/logs /var/lib/elysian/state /var/lib/elysian/backups /var/lib/elysian/tmp /var/lib/elysian/config && ln -sfn /var/lib/elysian /root/.Elysian && if [ ! -e /root/.Elysian/ssh/host-keys/ssh_host_ed25519_key ]; then cp -a /etc/ssh/ssh_host_* /root/.Elysian/ssh/host-keys/; fi && ln -sfn /root/.Elysian/ssh/host-keys/* /etc/ssh/ && mkdir -p /run/sshd && (/usr/sbin/sshd -E /root/.Elysian/logs/sshd.log || true) && bun install && (bun run --filter @elysian/server dev &) && bun run dev"

volumes:
  elysian_metrics:
  elysian_node_modules:
  elysian_web_node_modules:
  elysian_contracts_node_modules:
  elysian_ssh_host_keys:

networks:
  elysian-db-local:
    name: elysian-db-local
  elysian-db-shared:
    name: elysian-db-shared
