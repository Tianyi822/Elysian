<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysian 运维工作台</title>
    <script>
      // 首屏主题跟随系统：在样式生效之前把主题属性落到 html 上，
      // 否则浅色系统会先闪一下深色底。之后的切换由界面接管，不再回读系统偏好。
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches
        ? 'light'
        : 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
