<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Elysian</title>
    <script>
      // 首屏主题：保存的偏好优先，登录页默认深色，其余页面默认跟随系统。
      // 在样式生效之前写到 html 上，避免闪一帧错的主题。格式与校验规则的唯一权威是
      // src/app/theme/themePreferences.ts，这里只能内联同一份逻辑（模块脚本太晚）。
      ;(() => {
        let stored = null
        try {
          const parsed = JSON.parse(localStorage.getItem('elysian.ui-preferences') || '')
          if (parsed && parsed.version === 1 && (parsed.theme === 'light' || parsed.theme === 'dark')) {
            stored = parsed.theme
          }
        } catch {
          // 无效偏好使用当前页面的默认主题。
        }
        const login = /^\/login\/*$/i.test(document.location?.pathname ?? '')
        let fallback = 'dark'
        try {
          if (!login && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: light)').matches) fallback = 'light'
        } catch { /* 读取不到系统偏好时使用深色。 */ }
        document.documentElement.dataset.theme = stored ?? fallback
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
